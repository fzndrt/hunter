name: Corridor Desk Radar Cron (Vercel Trigger)

on:
  schedule:
    # Berjalan otomatis setiap 5 menit GRATIS (mengatasi limit 1x/hari Cron di Vercel Hobby)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-vercel-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/scan
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VERCEL_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set VERCEL_APP_URL dan CRON_SECRET di GitHub Repository Secrets terlebih dahulu."
            exit 1
          fi
          BASE_URL="${VERCEL_APP_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/scan_resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/scan")
          echo "HTTP Status: ${HTTP_CODE}"
          cat /tmp/scan_resp.json
          echo ""
          if [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi
